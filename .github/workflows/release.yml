name: Release

# Membuat GitHub Release (tag vX.Y.Z) menerbitkan paket ke npm. Tag harus sama dengan versi di
# package.json. Versi pra-rilis (mis. 0.2.0-beta.1) terbit dengan dist-tag sendiri (beta),
# sehingga tidak pernah menggantikan `latest`.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Lint & format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: node scripts/build.mjs

      - name: Smoke test (Node)
        run: node scripts/smoke.mjs

      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Build dan semua pengujian sudah dijalankan di atas, jadi skrip prepublishOnly/prepack
          # dilewati agar tidak berjalan dua kali.
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            npm publish --ignore-scripts --access public --provenance --tag "${PRERELEASE%%.*}"
          else
            npm publish --ignore-scripts --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
